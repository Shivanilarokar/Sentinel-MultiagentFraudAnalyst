[project]
name = "sentinel"
version = "1.0.0"
description = "Multi-agent fraud triage for the Sentinel Bank alert queue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain[openai]>=1.3,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.11",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
