[project]
name = "sentinel"
version = "2.0.0"
description = "Multi-agent fraud triage for the Sentinel Bank alert queue"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # The framework the class was taught on.
    "langchain[openai]>=1.3,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.11",
    "python-dotenv>=1.0",

    # Operator surface
    "typer>=0.12",
    "rich>=13",

    # Token measurement for WRITEUP.md
    "tiktoken>=0.7",

    # Notebooks
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "tabulate>=0.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
